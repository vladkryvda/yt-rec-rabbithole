<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Recommendations Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      user-select: none;
    }

    main {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .search-bar {
      display: flex;
      width: 100%;
      max-width: 580px;
      background: #141414;
      border: 1px solid #222222;
      border-radius: 28px;
      padding: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-bar:focus-within {
      border-color: #333333;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-bar button {
      background: #222222;
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-bar button:hover {
      background: #333333;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 28px;
    }

    .current-title {
      font-size: 14px;
      color: #777777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .current-title span {
      color: #e5e5e5;
      font-weight: 500;
    }

    .back-btn {
      background: #161616;
      border: 1px solid #262626;
      color: #aaaaaa;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #222222;
      color: #ffffff;
      border-color: #333333;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .video-card {
      position: relative;
      background: #111111;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      border: 1px solid #1c1c1c;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .video-card:hover {
      transform: scale(1.02);
      border-color: #333333;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .video-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-card .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.88) 100%);
      padding: 12px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .video-card:hover .card-overlay {
      opacity: 1;
    }

    .video-title {
      font-size: 12px;
      line-height: 1.3;
      color: #ffffff;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .state-message {
      text-align: center;
      padding: 100px 20px;
      font-size: 14px;
      color: #555555;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #222222;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <main>
    <div class="controls-wrapper">
      <div class="search-bar">
        <input type="text" id="urlInput" placeholder="Paste YouTube link or Video ID..." />
        <button id="searchBtn">Explore</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="current-title" id="currentTitle"></div>
      <button class="back-btn" id="backBtn">← Back</button>
    </div>

    <div id="contentArea">
      <div class="state-message">Paste a YouTube link above to start exploring</div>
    </div>
  </main>

  <div class="toast" id="toast">Link copied to clipboard!</div>

  <script>
    var historyStack = [];
    var currentVideoId = null;

    var urlInput = document.getElementById('urlInput');
    var searchBtn = document.getElementById('searchBtn');
    var currentTitle = document.getElementById('currentTitle');
    var backBtn = document.getElementById('backBtn');
    var contentArea = document.getElementById('contentArea');
    var toast = document.getElementById('toast');

    function extractVideoId(url) {
      if (!url) return '';
      url = url.trim();
      var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      var match = url.match(regExp);
      if (match && match[2].length === 11) return match[2];
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      return url;
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    function showToast(message) {
      toast.innerText = message;
      toast.classList.add('visible');
      setTimeout(function() {
        toast.classList.remove('visible');
      }, 2000);
    }

    function triggerSearch() {
      var val = urlInput.value;
      var id = extractVideoId(val);
      if (!id || id.length !== 11) return;
      historyStack = [];
      loadRecommendations(id, false);
    }

    async function loadRecommendations(videoId, isBackNav) {
      if (!videoId) return;

      if (!isBackNav && currentVideoId) {
        historyStack.push(currentVideoId);
      }
      currentVideoId = videoId;

      updateBackButton();
      contentArea.innerHTML = '<div class="state-message">Loading recommendations...</div>';

      try {
        var res = await fetch('/api/related?id=' + encodeURIComponent(videoId));
        var data = await res.json();

        if (!res.ok || data.error) {
          contentArea.innerHTML = '<div class="state-message">Error: ' + escapeHtml(data.error || 'Failed to fetch data') + '</div>';
          return;
        }

        currentTitle.innerHTML = 'Exploring recommendations for: <span>' + escapeHtml(data.current.title) + '</span>';

        if (!data.related || data.related.length === 0) {
          contentArea.innerHTML = '<div class="state-message">No recommendations found</div>';
          return;
        }

        renderGrid(data.related);

      } catch (err) {
        console.error(err);
        contentArea.innerHTML = '<div class="state-message">Network error</div>';
      }
    }

    function renderGrid(videos) {
      var html = '<div class="video-grid">';
      
      videos.forEach(function(video) {
        html += '<div class="video-card" data-id="' + video.id + '" title="' + escapeHtml(video.title) + '">';
        html += '  <img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">';
        html += '  <div class="card-overlay">';
        html += '    <div class="video-title">' + escapeHtml(video.title) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';
      contentArea.innerHTML = html;

      var cards = contentArea.querySelectorAll('.video-card');
      cards.forEach(function(card) {
        var id = card.getAttribute('data-id');

        // Left Click
        card.addEventListener('click', function(e) {
          loadRecommendations(id, false);
        });

        // Right Click
        card.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          var link = 'https://www.youtube.com/watch?v=' + id;
          navigator.clipboard.writeText(link).then(function() {
            showToast('Link copied to clipboard!');
          }).catch(function() {
            showToast('Failed to copy link');
          });
        });
      });
    }

    function updateBackButton() {
      if (historyStack.length > 0) {
        backBtn.style.display = 'inline-block';
      } else {
        backBtn.style.display = 'none';
      }
    }

    backBtn.addEventListener('click', function() {
      if (historyStack.length > 0) {
        var previousId = historyStack.pop();
        loadRecommendations(previousId, true);
      }
    });

    searchBtn.addEventListener('click', triggerSearch);

    urlInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        triggerSearch();
      }
    });

    // 🚀 Автозапуск при вставці посилання (Paste Event)
    urlInput.addEventListener('paste', function() {
      setTimeout(triggerSearch, 50);
    });
  </script>
</body>
</html>
