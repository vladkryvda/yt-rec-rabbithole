<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Recommendations Feed</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      background: #0f0f0f;
      border-bottom: 1px solid #272727;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .search-box {
      display: flex;
      width: 100%;
      max-width: 600px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 40px 0 0 40px;
      border: 1px solid #303030;
      background: #121212;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-box input:focus { border-color: #ff0000; }
    .search-box button {
      padding: 12px 24px;
      border-radius: 0 40px 40px 0;
      border: 1px solid #303030;
      border-left: none;
      background: #222222;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .search-box button:hover { background: #333333; }
    
    main {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #272727;
      flex-wrap: wrap;
      gap: 12px;
    }
    .current-info {
      font-size: 18px;
      font-weight: 500;
      color: #aaa;
    }
    .current-info span {
      color: #fff;
      font-weight: 600;
    }
    .back-btn {
      padding: 8px 18px;
      background: #272727;
      border: none;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #3f3f3f; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .video-card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #272727;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .video-card:hover {
      transform: translateY(-4px);
      border-color: #ff0000;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #272727;
    }
    .thumb-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 8px;
      color: #f1f1f1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .channel-title {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #ccc;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.2s, color 0.2s;
    }
    .action-btn:hover {
      background: #333;
      color: #fff;
    }
    .action-btn.copy-btn {
      background: #2b2b2b;
    }
    .action-btn.copy-btn:hover {
      background: #3a3a3a;
    }

    .loading, .empty-state {
      text-align: center;
      padding: 60px 20px;
      font-size: 18px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <div class="search-box">
      <input type="text" id="urlInput" placeholder="Вставити посилання на YouTube відео або ID...">
      <button id="searchBtn">Шукати</button>
    </div>
  </header>

  <main>
    <div class="nav-bar">
      <div class="current-info" id="currentInfo">
        Вставте посилання на відео вище, щоб розпочати
      </div>
      <button class="back-btn" id="backBtn">⬅️ Назад</button>
    </div>

    <div id="contentArea">
      <div class="empty-state">
        📺 Тут з'явиться ваша стрічка рекомендацій
      </div>
    </div>
  </main>

  <script>
    var historyStack = [];
    var currentVideoId = null;

    var urlInput = document.getElementById('urlInput');
    var searchBtn = document.getElementById('searchBtn');
    var currentInfo = document.getElementById('currentInfo');
    var backBtn = document.getElementById('backBtn');
    var contentArea = document.getElementById('contentArea');

    function extractVideoId(url) {
      if (!url) return '';
      url = url.trim();
      var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      var match = url.match(regExp);
      if (match && match[2].length === 11) return match[2];
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      return url;
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    async function loadRecommendations(videoId, isBackNav) {
      if (!videoId) return;

      if (!isBackNav && currentVideoId) {
        historyStack.push(currentVideoId);
      }
      currentVideoId = videoId;

      updateBackButton();

      contentArea.innerHTML = '<div class="loading">⏳ Завантажуємо стрічку рекомендацій...</div>';

      try {
        var res = await fetch('/api/related?id=' + encodeURIComponent(videoId));
        var data = await res.json();

        if (!res.ok || data.error) {
          contentArea.innerHTML = '<div class="empty-state">❌ Помилка: ' + escapeHtml(data.error || 'Не вдалося завантажити') + '</div>';
          return;
        }

        currentInfo.innerHTML = 'Рекомендації для: <span>' + escapeHtml(data.current.title) + '</span>';

        if (!data.related || data.related.length === 0) {
          contentArea.innerHTML = '<div class="empty-state">Не знайдено рекомендованих відео</div>';
          return;
        }

        renderGrid(data.related);

      } catch (err) {
        console.error(err);
        contentArea.innerHTML = '<div class="empty-state">❌ Помилка мережі при завантаженні</div>';
      }
    }

    function renderGrid(videos) {
      var html = '<div class="video-grid">';
      
      videos.forEach(function(video) {
        html += '<div class="video-card" data-id="' + video.id + '">';
        html += '  <div class="thumb-wrapper">';
        html += '    <img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">';
        html += '  </div>';
        html += '  <div class="card-content">';
        html += '    <div>';
        html += '      <div class="video-title">' + escapeHtml(video.title) + '</div>';
        html += '      <div class="channel-title">' + escapeHtml(video.channelTitle) + '</div>';
        html += '    </div>';
        html += '    <div class="card-actions">';
        html += '      <button class="action-btn copy-btn" data-id="' + video.id + '" title="Скопіювати посилання">';
        html += '        📋 Скопіювати лінк';
        html += '      </button>';
        html += '      <button class="action-btn open-btn" data-id="' + video.id + '" title="Відкрити на YouTube">';
        html += '        ▶️ YouTube';
        html += '      </button>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';
      contentArea.innerHTML = html;

      // Клік на картку — відкриває нову стрічку
      var cards = contentArea.querySelectorAll('.video-card');
      cards.forEach(function(card) {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.action-btn')) return;
          var id = card.getAttribute('data-id');
          loadRecommendations(id, false);
        });
      });

      // Кнопка копіювання посилання
      var copyBtns = contentArea.querySelectorAll('.copy-btn');
      copyBtns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = btn.getAttribute('data-id');
          var link = 'https://www.youtube.com/watch?v=' + id;
          
          navigator.clipboard.writeText(link).then(function() {
            var oldText = btn.innerHTML;
            btn.innerHTML = '✅ Скопійовано!';
            setTimeout(function() {
              btn.innerHTML = oldText;
            }, 1800);
          }).catch(function(err) {
            alert('Посилання: ' + link);
          });
        });
      });

      // Кнопка відкриття на YouTube
      var openBtns = contentArea.querySelectorAll('.open-btn');
      openBtns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = btn.getAttribute('data-id');
          window.open('https://www.youtube.com/watch?v=' + id, '_blank');
        });
      });
    }

    function updateBackButton() {
      if (historyStack.length > 0) {
        backBtn.style.display = 'inline-block';
      } else {
        backBtn.style.display = 'none';
      }
    }

    backBtn.addEventListener('click', function() {
      if (historyStack.length > 0) {
        var previousId = historyStack.pop();
        loadRecommendations(previousId, true);
      }
    });

    searchBtn.addEventListener('click', function() {
      var val = urlInput.value;
      var id = extractVideoId(val);
      if (!id || id.length !== 11) {
        alert('Будь ласка, вставте коректне посилання на YouTube!');
        return;
      }
      historyStack = [];
      loadRecommendations(id, false);
    });

    urlInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchBtn.click();
      }
    });
  </script>
</body>
</html>
